name: ci
on:
  push:
  pull_request:
jobs:
  worker:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: worker } }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: vr
          POSTGRES_DB: vr
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d vr"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: worker/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      # A real Postgres service is mandatory in CI; local runs can skip when unavailable.
      - run: npm test
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: yarn, cache-dependency-path: frontend/yarn.lock }
      # yarn is the pinned package manager (frontend/package.json packageManager); yarn 1 only warns
      # on the react-day-picker/date-fns peer mismatch that npm needed --legacy-peer-deps for.
      - run: yarn install --frozen-lockfile
      - run: yarn build
        env:
          CI: "false"   # CRA treats warnings as errors under CI=true; the build, not lint, is the gate here
          REACT_APP_BACKEND_URL: https://verifyruns-api.farjad-developer.workers.dev
          INLINE_RUNTIME_CHUNK: "false"
