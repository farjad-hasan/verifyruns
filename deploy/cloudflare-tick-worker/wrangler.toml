# Cloudflare Worker that ticks VerifyRuns once a minute. Free plan is enough (1,440 requests/day).
#   npm i -g wrangler && wrangler login
#   wrangler secret put TICK_SECRET      # the VR_TICK_SECRET from the API host
#   wrangler deploy
name = "verifyruns-tick"
main = "src/index.js"
compatibility_date = "2026-08-01"

[vars]
TICK_URL = "https://verifyruns-api.onrender.com/api/internal/tick"   # change to your API URL

[triggers]
crons = ["* * * * *"]
